name: Daegu map checks
on:
  push:
    branches: [main, fix/daegu-map-reliability]
    paths: ['daegu-map/**', '.github/workflows/daegu-map-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: daegu-map/package-lock.json
      - run: npm ci
        working-directory: daegu-map
      - run: npx playwright install --with-deps chromium
        working-directory: daegu-map
      - run: npm test
        working-directory: daegu-map
      - name: Browser regression tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/daegu-map-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/daegu-map/ > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix daegu-map run test:e2e
