<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F1EA" />
  <title>사사로운 · Sasaroun</title>
  <meta name="description" content="사사로운 (私思, Sasaroun) — a private & thoughtful gift shop by 빛날현." />

  <style>
    /* ── Brand palette (from 빛날현 홈페이지 기획안) ───────────── */
    :root {
      --paper:  #F5F1EA;   /* 오프화이트 */
      --gold:   #C9A678;   /* 낡은 금색 */
      --ink:    #2B2620;   /* 먹색 */
      --sub:    #8B7E6E;   /* 옅은 갈색 */
      --line:   #E4DDD1;
      --card:   #FBF9F4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .serif {
      font-family: "Nanum Myeongjo", "Apple SD Gothic Neo", Georgia,
                   "Times New Roman", serif;
    }

    .wrap {
      max-width: 620px;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 40px) 24px
               calc(env(safe-area-inset-bottom) + 48px);
      min-height: 100%;
    }

    /* ── Brand mark (always visible) ────────────────────────── */
    .brand { text-align: center; margin-bottom: 30px; }
    .brand__han   { font-size: 40px; letter-spacing: 0.18em; font-weight: 700; }
    .brand__hanja { margin-top: 8px; font-size: 20px; letter-spacing: 0.5em; color: var(--gold); }
    .brand__rule  { width: 44px; height: 1px; background: var(--gold); margin: 18px auto; opacity: 0.7; }
    .brand__rom   { font-size: 12px; letter-spacing: 0.42em; text-transform: uppercase; color: var(--sub); }
    .brand__en    { margin-top: 4px; font-size: 13px; font-style: italic; color: var(--sub); }
    .brand__shop  {
      display: inline-block; margin-top: 18px; padding: 6px 16px;
      border: 1px solid var(--gold); border-radius: 999px;
      font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold);
    }

    /* ── Photo carousel (auto-advancing, swipe, peek) ───────── */
    .gallery {
      position: relative;
      display: flex; gap: 12px; overflow-x: auto;
      margin: 40px 0 0; padding: 0 11% 4px;
      scroll-snap-type: x proximity; scroll-behavior: smooth;
      scroll-padding: 0 11%;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .gallery::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 78%; scroll-snap-align: center; margin: 0;
      aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden;
      background: var(--card); border: 1px solid var(--line);
    }
    .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .slide--empty { display: flex; align-items: center; justify-content: center; border-style: dashed; border-color: var(--gold); }
    .slide--empty span { font-size: 12px; letter-spacing: 0.1em; color: var(--sub); }

    .dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; padding: 0;
      border: none; background: var(--line); cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .dot.on { background: var(--gold); transform: scale(1.3); }

    /* ── Language picker (slim single-column list) ──────────── */
    .pick__title {
      text-align: center; font-size: 14px; color: var(--sub);
      letter-spacing: 0.04em; margin-bottom: 18px;
    }
    .langs { display: flex; flex-direction: column; gap: 8px; }
    .lang {
      display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
      padding: 14px 18px;
      background: var(--card); border: 1px solid var(--line); border-radius: 11px;
      cursor: pointer; text-align: left; color: inherit; font: inherit;
      transition: border-color .15s ease, background .15s ease, transform .08s ease;
    }
    .lang:hover { border-color: var(--gold); }
    .lang:active { transform: scale(.99); }
    .lang__native { font-size: 16px; font-weight: 600; }
    .lang__latin  { font-size: 12px; color: var(--sub); letter-spacing: .03em; white-space: nowrap; }

    /* ── Detail view ────────────────────────────────────────── */
    .detail { display: none; }
    .detail.on { display: block; animation: fade .35s ease; }
    #picker.off { display: none; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .back {
      display: inline-flex; align-items: center; gap: 7px;
      background: none; border: none; cursor: pointer;
      color: var(--sub); font: inherit; font-size: 13px;
      padding: 8px 0; margin-bottom: 16px; letter-spacing: .02em;
    }
    .back:hover { color: var(--gold); }
    .back svg { width: 14px; height: 14px; }

    .detail__title { font-size: 28px; font-weight: 700; letter-spacing: .06em; margin-bottom: 10px; }
    .detail__lead  { font-size: 17px; color: var(--sub); font-style: italic; margin-bottom: 26px; }
    .detail__body p { margin-bottom: 18px; font-size: 16px; }
    .detail__body p:last-child { margin-bottom: 0; }

    .placeholder {
      margin-top: 8px; padding: 14px 16px;
      border: 1px dashed var(--gold); border-radius: 12px;
      background: rgba(201,166,120,.08);
      font-size: 13px; color: var(--sub);
    }

    .footer {
      margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line);
      text-align: center; font-size: 12px; color: var(--sub); letter-spacing: .02em;
    }
  </style>
</head>

    /* ══════════════════════════════════════════════════════════════
       LOGIC — 아래는 수정할 필요 없습니다.
       ══════════════════════════════════════════════════════════════ */
    var picker  = document.getElementById("picker");
    var detail  = document.getElementById("detail");
    var langsEl = document.getElementById("langs");

    // 사진 카루셀 (자동 슬라이드 + 스와이프 + 점 인디케이터)
    (function buildCarousel() {
      var gallery = document.getElementById("gallery");
      var dotsEl  = document.getElementById("dots");
      var n = PHOTOS.length;
      if (!n) { return; }

      PHOTOS.forEach(function (src, i) {
        var fig = document.createElement("figure");
        fig.className = "slide";
        var img = document.createElement("img");
        img.alt = "사사로운";
        img.loading = "lazy";
        img.onerror = function () {
          fig.classList.add("slide--empty");
          img.remove();
          fig.innerHTML = "<span>사진</span>";
        };
        img.src = src;
        fig.appendChild(img);
        gallery.appendChild(fig);

        var dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot" + (i === 0 ? " on" : "");
        dot.setAttribute("aria-label", "사진 " + (i + 1));
        dot.addEventListener("click", function () { go(i); reset(); });
        dotsEl.appendChild(dot);
      });

      var slides = gallery.children;
      var dots = dotsEl.children;
      var timer = null;

      function centerOf(i) {
        var s = slides[i];
        return s.offsetLeft - (gallery.clientWidth - s.clientWidth) / 2;
      }
      function go(i) { gallery.scrollTo({ left: centerOf(i), behavior: "smooth" }); }
      function current() {
        var c = gallery.scrollLeft, best = 0, min = Infinity;
        for (var i = 0; i < n; i++) {
          var d = Math.abs(centerOf(i) - c);
          if (d < min) { min = d; best = i; }
        }
        return best;
      }
      function paint(i) {
        for (var k = 0; k < n; k++) { dots[k].classList.toggle("on", k === i); }
      }
      function reset() {
        clearInterval(timer);
        timer = setInterval(function () { go((current() + 1) % n); }, 4500);
      }

      var raf = null;
      gallery.addEventListener("scroll", function () {
        if (raf) { return; }
        raf = requestAnimationFrame(function () { raf = null; paint(current()); });
      }, { passive: true });

      // 사용자가 만지면 타이머 리셋
      ["pointerdown", "touchstart", "wheel"].forEach(function (ev) {
        gallery.addEventListener(ev, reset, { passive: true });
      });

      reset();
    })();

    // 언어 버튼 렌더
    LANGS.forEach(function (l) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "lang";
      btn.setAttribute("lang", l.code);
      btn.setAttribute("aria-label", l.latin);
      btn.innerHTML =
        '<span class="lang__native">' + l.native + '</span>' +
        '<span class="lang__latin">' + l.latin + '</span>';
      btn.addEventListener("click", function () { location.hash = l.code; });
      langsEl.appendChild(btn);
    });

    function show(code) {
      var c = CONTENT[code];
      if (!c) { showPicker(); return; }

      document.documentElement.lang = code;
      document.getElementById("dTitle").textContent = c.title;
      document.getElementById("dLead").textContent  = c.lead || "";
      document.getElementById("backLabel").textContent = BACK[code] || "Change language";

      var bodyEl = document.getElementById("dBody");
      bodyEl.innerHTML = "";
      if (c.body && c.body.length) {
        c.body.forEach(function (para) {
          var p = document.createElement("p");
          p.textContent = para;
          bodyEl.appendChild(p);
        });
      } else {
        var note = document.createElement("div");
        note.className = "placeholder";
        note.textContent = PLACEHOLDER[code] || PLACEHOLDER.en;
        bodyEl.appendChild(note);
      }

      picker.classList.add("off");
      detail.classList.add("on");
      window.scrollTo(0, 0);
    }

    function showPicker() {
      detail.classList.remove("on");
      picker.classList.remove("off");
      document.documentElement.lang = "ko";
      window.scrollTo(0, 0);
    }

    document.getElementById("back").addEventListener("click", function () {
      location.hash = "";
    });

    function route() {
      var code = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
      if (code && CONTENT[code]) { show(code); }
      else { showPicker(); }
    }

    window.addEventListener("hashchange", route);
    route();
  </script>
