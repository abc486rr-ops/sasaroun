<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스파이크: CSS 3D 안의 Leaflet</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  body { font: 14px -apple-system, sans-serif; margin: 0; padding: 12px; }
  h2 { font-size: 14px; margin: 16px 0 6px; }
  .flip { perspective: 1200px; }
  .flip__inner {
    position: relative;
    width: 100%;
    height: 220px;
    transform-style: preserve-3d;
    transform: rotateY(180deg);
  }
  .face { position: absolute; inset: 0; backface-visibility: hidden; }
  .face--back { transform: rotateY(180deg); }
  .plain { width: 100%; height: 220px; }
  pre { background: #f4f4f0; padding: 8px; font-size: 12px; overflow: auto; }
</style>
</head>
<body>
<h2>A. 3D 뒤집기 컨테이너 안</h2>
<div class="flip"><div class="flip__inner"><div class="face face--back"><div id="m3d" style="width:100%;height:100%"></div></div></div></div>

<h2>B. 3D 바깥 (대조군)</h2>
<div class="plain" id="mflat"></div>

<pre id="out">측정 중…</pre>

<script src="vendor/leaflet.js"></script>
<script>
const CENTER = [35.8714, 128.6014]
const TILE = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'
const opts = { attribution: '&copy; OpenStreetMap &copy; CARTO' }

function build(id) {
  const map = L.map(id, { zoomControl: false, attributionControl: true }).setView(CENTER, 15)
  L.tileLayer(TILE, opts).addTo(map)
  L.marker(CENTER).addTo(map)
  return map
}

const a = build('m3d')
const b = build('mflat')

/* 핵심 검사: 화면 좌표 → 위경도 변환이 맞는지.
 * 3D 변환 안에서는 Leaflet 이 컨테이너 위치를 잘못 읽어 이 값이 어긋난다.
 * 어긋나면 탭한 곳과 실제 지도 위치가 달라진다. */
function probe(map, label) {
  const el = map.getContainer()
  const r = el.getBoundingClientRect()
  const centerPt = map.containerPointToLatLng([el.clientWidth / 2, el.clientHeight / 2])
  const c = map.getCenter()
  const drift = map.distance(centerPt, c)
  const tiles = el.querySelectorAll('.leaflet-tile-loaded').length
  return {
    label,
    rect: { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.width), h: Math.round(r.height) },
    size: { w: el.clientWidth, h: el.clientHeight },
    타일로드: tiles,
    중심역산오차_m: Math.round(drift * 100) / 100
  }
}

/* 진짜 실패 모드: 화면 좌표 → 위경도.
 * Leaflet 은 getBoundingClientRect 로 컨테이너 위치를 잡는데,
 * 3D 변환이 걸리면 실제 화면 위치와 어긋나 탭한 곳이 엉뚱하게 잡힌다. */
function tapProbe(map, label) {
  const el = map.getContainer()
  const r = el.getBoundingClientRect()
  const sx = r.x + r.width / 2
  const sy = r.y + r.height / 2
  const ll = map.mouseEventToLatLng({ clientX: sx, clientY: sy })
  return {
    label,
    화면_정중앙: { x: Math.round(sx), y: Math.round(sy) },
    오차_m: Math.round(map.distance(ll, map.getCenter()) * 100) / 100
  }
}

setTimeout(() => {
  const res = {
    A_3D안: probe(a, '3D 안'),
    B_3D밖: probe(b, '3D 밖'),
    탭_3D안: tapProbe(a, '3D 안'),
    탭_3D밖: tapProbe(b, '3D 밖')
  }
  document.getElementById('out').textContent = JSON.stringify(res, null, 2)
  window.__SPIKE__ = res
}, 2500)
</script>
</body>
</html>
